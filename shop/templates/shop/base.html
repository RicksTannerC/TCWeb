{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TCR{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'shop/css/style.css' %}" />
</head>
<body>
  <header>
    <a href="{% url 'shop:product_list' %}" class="brand">
      <svg class="micro" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L92 22 L92 55 C92 82 74 98 50 105 C26 98 8 82 8 55 L8 22 Z" fill="none" stroke="var(--stone)" stroke-width="4"/>
        <line x1="50" y1="20" x2="50" y2="85" stroke="var(--steel)" stroke-width="6"/>
        <circle cx="50" cy="14" r="5" fill="var(--stone)"/>
        <path d="M35 30 L50 20 L65 30 L58 34 L50 28 L42 34 Z" fill="var(--olive)"/>
      </svg>
      <span class="wordmark">TCR</span>
    </a>
    <nav>
      <a href="{% url 'shop:product_list' %}">Shop</a>
      <a href="{% url 'shop:cart_detail' %}">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>TCR — placeholder identity, pilot build.</p>
  </footer>
</body>
</html>
