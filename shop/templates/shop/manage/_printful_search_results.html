{% if q and q|length < 2 %}
{% elif results %}
  <ul class="printful-results" role="list">
    {% for r in results %}
      <li>
        <button type="button" class="printful-result"
                @click="document.getElementById('printful_blueprint_id').value = '{{ r.id }}';
                        document.getElementById('printful_blueprint_name').value = '{{ r.title|escapejs }}';
                        label = '{{ r.title|escapejs }}';
                        $el.closest('.printful-results').innerHTML = '';">
          <strong>{{ r.title }}</strong> <span class="faint">&middot; {{ r.brand }} &middot; #{{ r.id }}</span>
        </button>
      </li>
    {% endfor %}
  </ul>
{% elif q %}
  <p class="faint">No Printful products match &ldquo;{{ q }}&rdquo;.</p>
{% endif %}
