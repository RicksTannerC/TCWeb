{% extends "shop/manage/base.html" %}
{% block title %}{{ col.name }}{% endblock %}

{% block page %}
<section class="g-dense c-stack">
  <div class="c-head">
    <div>
      <p class="g-muted g-small c-crumb"><a href="{% url 'shop:manage_collections' %}">&larr; Collections</a></p>
      <h1>{{ col.name }}</h1>
    </div>
  </div>

  <form method="post" class="c-form">
    {% csrf_token %}
    <div class="c-cols">
      <div class="g-well c-stack">
        <div class="g-field"><label for="name">Name</label>
          <input class="g-input" id="name" name="name" value="{{ col.name }}" {% if col.is_base %}readonly{% endif %} /></div>
        <div class="g-field"><label for="summary">Summary</label>
          <textarea class="g-input" id="summary" name="summary" rows="2">{{ col.summary }}</textarea></div>
        <div class="c-pair">
          <div class="g-field"><label for="status">Status</label>
            <select class="g-input" id="status" name="status">
              <option value="hidden" {% if col.status == 'hidden' %}selected{% endif %}>Hidden (staging)</option>
              <option value="live" {% if col.status == 'live' %}selected{% endif %}>Live</option>
            </select></div>
          <div class="g-field"><label for="go_live_at">Go live at</label>
            <input class="g-input" id="go_live_at" name="go_live_at" type="datetime-local"
                   value="{{ col.go_live_at|date:'Y-m-d\TH:i' }}" /></div>
        </div>
      </div>

      <div class="g-well c-stack">
        <h2 class="c-label">Members</h2>
        <p class="g-muted g-small">Tick the listings in this collection. Drafts aren't shown.</p>
        <ul class="member-list">
          {% for l in all_listings %}
            <li>
              <label>
                <input type="checkbox" name="listings" value="{{ l.id }}" {% if l.id in member_ids %}checked{% endif %} />
                {{ l.design.title }} <span class="g-muted g-small">— {{ l.get_product_type_display }}{% if l.color %} · {{ l.color }}{% endif %} · {{ l.get_status_display }}</span>
              </label>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <div class="g-row"><button type="submit" class="g-btn g-btn-primary">Save collection</button></div>
  </form>
</section>
{% endblock %}
